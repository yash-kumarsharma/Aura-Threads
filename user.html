<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Product Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1200px;
        }

        .profile-section {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .profile-details {
            margin-top: 15px;
        }

        .logout-btn {
            margin-top: 20px;
            background-color: #ff6347;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
        }

        .logout-btn:hover {
            background-color: #e54b3e;
        }

        .form-section {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .modal-content {
            padding: 30px;
            border-radius: 10px;
        }

        .product-card {
            margin-bottom: 30px;
        }

        .product-form .form-label {
            font-weight: bold;
        }

        #imagePreview {
            max-height: 200px;
            max-width: 100%;
            object-fit: contain;
            margin-top: 10px;
        }

     
        .product-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product-card {
            flex: 1 0 calc(33.33% - 16px); 
            margin-bottom: 20px;
        }

        .card {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="row">
            <div class="col-lg-3 col-md-4 col-sm-12">
                <div class="profile-section">
                    <div class="text-center">

                        <h3 class="profile-name">Yash Sharma</h3>
                        <p>Location: Chandigarh, India</p>
                        <p>Email: yash@gmail.com</p>
                    </div>
                    <button class="logout-btn" onclick="logout()">Log Out</button>
                </div>
            </div>
            <div class="col-lg-9 col-md-8 col-sm-12">
                <div class="form-section">
                    <h2 class="text-center mb-5">Add New Product</h2>
                    <form id="productForm">
                        <div class="mb-3">
                            <label for="productName" class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="mb-3">
                            <label for="productBrand" class="form-label">Brand</label>
                            <input type="text" class="form-control" id="productBrand" required>
                        </div>
                        <div class="mb-3">
                            <label for="productPrice" class="form-label">Price (₹)</label>
                            <input type="number" class="form-control" id="productPrice" required>
                        </div>
                        <div class="mb-3">
                            <label for="productSize" class="form-label">Size (optional)</label>
                            <input type="text" class="form-control" id="productSize">
                        </div>
                        <div class="mb-3">
                            <label for="productCategory" class="form-label">Category</label>
                            <select class="form-control" id="productCategory" required>
                                <option value="hoodies">Hoodies</option>
                                <option value="sweater">Sweater</option>
                                <option value="T-shirts">T-shirts</option>
                                <option value="Jeans">Jeans</option>
                                <option value="Footwear">Footwear</option>
                                <option value="Shirts">Shirts</option>
                                <option value="shorts">Shorts</option>
                                <option value="Trousers">Trousers</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="productImage" class="form-label">Upload Image</label>
                            <input type="file" class="form-control" id="productImage" accept="image/*" required>
                            <img id="imagePreview" src="" alt="Image Preview" style="display:none;">
                        </div>
                        <button type="submit" class="btn btn-primary">Add Product</button>
                    </form>
                </div>

                <h2 class="my-5 text-center">Uploaded Products</h2>
                <div id="uploadedProducts" class="row"></div> 
            </div>
        </div>
    </div>

    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="successModalLabel">Product Added Successfully</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Your product has been successfully added to the list.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const products = [];

        function displayUploadedProducts() {
            const uploadedList = document.getElementById("uploadedProducts");
            uploadedList.innerHTML = '';

            if (products.length > 0) {
                products.forEach((product) => {
                    const productItem = document.createElement("div");
                    productItem.className = "col-12 col-md-4 col-lg-4";
                    productItem.innerHTML = `
                        <div class="card product-card">
                            <img src="${product.image}" class="card-img-top" alt="${product.name}" style="max-height: 200px; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title">${product.name}</h5>
                                <p class="card-text">Brand: ${product.brand}</p>
                                <p class="card-text">₹${product.price}</p>
                                <p class="card-text">Size: ${product.size || "N/A"}</p>
                                <p class="card-text">Category: ${product.category}</p>
                            </div>
                        </div>
                    `;
                    uploadedList.appendChild(productItem);
                });
            } else {
                uploadedList.innerHTML = "<p>No products uploaded yet.</p>";
            }
        }

        document.getElementById("productImage").addEventListener("change", function(event) {
            const file = event.target.files[0];
            const reader = new FileReader();

            reader.onloadend = function() {
                const imageUrl = reader.result;
                const imagePreview = document.getElementById("imagePreview");
                imagePreview.src = imageUrl;
                imagePreview.style.display = "block";
            };

            if (file) {
                reader.readAsDataURL(file);
            }
        });

        document.getElementById("productForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const productName = document.getElementById("productName").value;
            const productBrand = document.getElementById("productBrand").value;
            const productPrice = document.getElementById("productPrice").value;
            const productSize = document.getElementById("productSize").value;
            const productCategory = document.getElementById("productCategory").value;
            const productImage = document.getElementById("imagePreview").src;

            const newProduct = {
                name: productName,
                brand: productBrand,
                price: productPrice,
                size: productSize,
                category: productCategory,
                image: productImage,
            };

            products.push(newProduct);
            displayUploadedProducts();

            const successModal = new bootstrap.Modal(document.getElementById('successModal'));
            successModal.show();

            document.getElementById("productForm").reset();
            document.getElementById("imagePreview").style.display = "none";
        });

        function logout() {
            alert("Logging out...");
            window.location.href = "/logout";
        }
    </script>
</body>
</html>
