<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cart-item img {
            max-width: 100px;
        }
        .cart-total {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Your Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="cart_page.html" class="nav-link active">Cart</a>
                    </li>
                    <li class="nav-item">
                        <a href="login_page.html" class="nav-link">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2>Your Shopping Cart</h2>
        <div class="row">
            <!-- Cart Item 1 -->
            <div class="col-md-12 cart-item mb-4">
                <div class="card">
                    <div class="row g-0">
                        <div class="col-md-2">
                            <img src="https://via.placeholder.com/150" class="img-fluid rounded-start" alt="product-image">
                        </div>
                        <div class="col-md-8">
                            <div class="card-body">
                                <h5 class="card-title">Product Name</h5>
                                <p class="card-text">Brand: Product Brand</p>
                                <p class="card-text">Price: ₹1,299</p>
                                <p class="card-text">Quantity: 
                                    <select class="form-select" style="width: 80px;">
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                    </select>
                                </p>
                            </div>
                        </div>
                        <div class="col-md-2 text-end">
                            <button class="btn btn-danger">Remove</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cart Item 2 -->
            <div class="col-md-12 cart-item mb-4">
                <div class="card">
                    <div class="row g-0">
                        <div class="col-md-2">
                            <img src="https://via.placeholder.com/150" class="img-fluid rounded-start" alt="product-image">
                        </div>
                        <div class="col-md-8">
                            <div class="card-body">
                                <h5 class="card-title">Product Name</h5>
                                <p class="card-text">Brand: Product Brand</p>
                                <p class="card-text">Price: ₹999</p>
                                <p class="card-text">Quantity: 
                                    <select class="form-select" style="width: 80px;">
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                    </select>
                                </p>
                            </div>
                        </div>
                        <div class="col-md-2 text-end">
                            <button class="btn btn-danger">Remove</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 offset-md-6">
                <div class="card">
                    <div class="card-body">
                        <h4 class="cart-total">Total: ₹2,298</h4>
                        <button class="btn btn-primary w-100">Proceed to Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
