<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Profile</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (Optional) -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="bg-primary text-white p-4">
        <div class="container d-flex justify-content-between align-items-center">
            <img src="seller-profile-picture.jpg" alt="Seller Profile" class="profile-img rounded-circle" width="50" height="50">
            <h2>Welcome, Seller Name</h2>
            <nav>
                <a href="home.html" class="btn btn-light btn-sm">Home</a>
                <a href="logout.html" class="btn btn-danger btn-sm">Logout</a>
            </nav>
        </div>
    </header>

    <main class="container mt-4">
        <!-- Dashboard Section -->
        <section class="dashboard mb-4">
            <h3>Your Seller Dashboard</h3>
            <div class="row">
                <div class="col-md-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">Products Listed</h5>
                            <p class="card-text" id="listed-products">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">Sold Items</h5>
                            <p class="card-text" id="sold-items">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">Pending Items</h5>
                            <p class="card-text" id="pending-items">0</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Manage Products Section -->
        <section class="manage-products">
            <h3>Manage Your Products</h3>

            <!-- Upload New Product Form -->
            <div class="card mb-4">
                <div class="card-header">
                    <h4>Upload New Product</h4>
                </div>
                <div class="card-body">
                    <form id="upload-product-form">
                        <div class="mb-3">
                            <label for="product-title" class="form-label">Product Title</label>
                            <input type="text" class="form-control" id="product-title" name="product-title" required>
                        </div>
                        <div class="mb-3">
                            <label for="product-description" class="form-label">Product Description</label>
                            <textarea class="form-control" id="product-description" name="product-description" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="product-price" class="form-label">Price</label>
                            <input type="number" class="form-control" id="product-price" name="product-price" required>
                        </div>
                        <div class="mb-3">
                            <label for="product-category" class="form-label">Category</label>
                            <select class="form-select" id="product-category" name="product-category" required>
                                <option value="electronics">Electronics</option>
                                <option value="fashion">Fashion</option>
                                <option value="home">Home & Kitchen</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="product-image" class="form-label">Product Image</label>
                            <input type="file" class="form-control" id="product-image" name="product-image" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Upload Product</button>
                    </form>
                </div>
            </div>

            <!-- Product List Table -->
            <div class="card">
                <div class="card-header">
                    <h4>Your Products</h4>
                </div>
                <div class="card-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">Product Name</th>
                                <th scope="col">Category</th>
                                <th scope="col">Price</th>
                                <th scope="col">Status</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body">
                            <!-- Product rows will be dynamically populated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p>© 2024 Shopping Website | <a href="terms.html" class="text-white">Terms of Service</a> | <a href="privacy.html" class="text-white">Privacy Policy</a></p>
    </footer>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js">
        document.addEventListener("DOMContentLoaded", () => {
    // Simulating a product database
    let products = [
        { name: "Laptop", category: "Electronics", price: 500, status: "Available" },
        { name: "Shoes", category: "Fashion", price: 100, status: "Sold" }
    ];

    const productTableBody = document.getElementById('product-table-body');
    const listedProductsSpan = document.getElementById('listed-products');
    const soldItemsSpan = document.getElementById('sold-items');
    const pendingItemsSpan = document.getElementById('pending-items');

    // Update the product table and stats
    function updateProductTable() {
        productTableBody.innerHTML = ''; // Clear the table
        let listedCount = 0, soldCount = 0, pendingCount = 0;
        products.forEach((product, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${product.name}</td>
                <td>${product.category}</td>
                <td>$${product.price}</td>
                <td>${product.status}</td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="markAsSold(${index})">Mark as Sold</button>
                    <button class="btn btn-danger btn-sm" onclick="removeProduct(${index})">Remove</button>
                </td>
            `;
            productTableBody.appendChild(row);

            if (product.status === "Available") listedCount++;
            if (product.status === "Sold") soldCount++;
            if (product.status === "Available") pendingCount++;
        });

        listedProductsSpan.textContent = listedCount;
        soldItemsSpan.textContent = soldCount;
        pendingItemsSpan.textContent = pendingCount;
    }

    // Function to mark a product as sold
    window.markAsSold = (index) => {
        products[index].status = "Sold";
        updateProductTable();
    };

    // Function to remove a product
    window.removeProduct = (index) => {
        products.splice(index, 1);
        updateProductTable();
    };

    // Initial table update
    updateProductTable();

    // Handling the form submission for new product upload
    document.getElementById("upload-product-form").addEventListener("submit", (e) => {
        e.preventDefault();

        const newProduct = {
            name: document.getElementById("product-title").value,
            category: document.getElementById("product-category").value,
            price: parseFloat(document.getElementById("product-price").value),
            status: "Available"
        };

        products.push(newProduct);
        updateProductTable();
    });
});

    </script>
</body>
</html>
